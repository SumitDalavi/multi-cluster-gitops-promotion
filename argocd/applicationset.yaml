apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: multi-cluster-promotion
  namespace: argocd
spec:
  generators:
  - list:
      elements:
      - cluster: dev-cluster
        url: https://dev-cluster.example.com
        env: dev
      - cluster: staging-cluster
        url: https://staging-cluster.example.com
        env: staging
      - cluster: prod-cluster
        url: https://prod-cluster.example.com
        env: prod
  template:
    metadata:
      name: 'myapp-{{env}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/example/multi-cluster.git
        targetRevision: HEAD
        path: clusters/{{env}}
      destination:
        server: '{{url}}'
        namespace: myapp-{{env}}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true

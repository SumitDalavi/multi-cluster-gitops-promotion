apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-portfolio-catalog
  namespace: argocd
  labels:
    tier: master-orchestrator
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/SumitDalavi/multi-cluster-gitops-promotion.git
    targetRevision: master
    path: argocd/applicationsets
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

replicaCount: 1
image:
  repository: ghcr.io/sumitdalavi/k8s-golden-path-provisioner
  tag: v0.2.0
  pullPolicy: IfNotPresent
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi
securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
